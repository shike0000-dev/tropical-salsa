<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aanmelding ontvangen | Tropical</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
:root {
  --nacht: #07151c; --teal: #1a7a76; --koraal: #e25b48; --goud: #d7b06a; --goud-licht: #efd7a3;
  --zand: #f4eadb; --creme: #fbf6ee; --tekst: #1c2a30; --muted: #5b6b72;
  --lijn: rgba(215, 176, 106, 0.28); --shadow: 0 18px 50px rgba(7, 21, 28, 0.18);
  --font-display: "Fraunces", Georgia, serif; --font-sans: "Outfit", "Segoe UI", sans-serif;
}
body { margin: 0; font-family: var(--font-sans); color: var(--tekst); background: var(--creme); line-height: 1.55; }
.wrap { width: min(720px, calc(100% - 40px)); margin: 80px auto; }
.card { background: #fff; border-radius: 24px; padding: 36px; box-shadow: var(--shadow); }
h1 { font-family: var(--font-display); font-weight: 500; margin: 0 0 12px; }
p { color: var(--muted); }
a { color: var(--teal); }
.btn { display: inline-flex; margin-top: 18px; background: var(--koraal); color: #fff; text-decoration: none; border-radius: 999px; padding: 12px 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Aanmelding ontvangen</h1>
      <p>Bedankt. We bekijken je inschrijving en nemen contact op. Het tarief volgt pas na acceptatie.</p>
      <a class="btn" href="index.html">Terug naar home</a>
    </div>
  </div>
</body>
</html>
